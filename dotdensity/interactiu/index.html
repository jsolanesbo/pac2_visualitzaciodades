        var map = L.map('map', {

        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

            switch(String(feature.properties['layer'])) {

        map.createPane('pane_Any2022_3');

        map.getPane('pane_Any2022_3').style['mix-blend-mode'] = 'normal';
        var layer_Any2022_3 = new L.geoJson(json_Any2022_3, {

            interactive: false,

        bounds_group.addLayer(layer_Any2022_3);
        map.addLayer(layer_Any2022_3);
        // Control propi: un sol any visible i categories activables
        var yearLayers = {'2022': layer_Any2022_3, '2000': layer_Any2000_2};
        var styleFns = {'2022': style_Any2022_3_0, '2000': style_Any2000_2_0};
        var categories = [
            {key: 'catalunya', label: 'Catalunya', color: 'rgb(40,120,181)'},
            {key: 'espanya', label: 'Espanya', color: 'rgb(230,159,0)'},
            {key: 'estranger', label: 'Estranger', color: 'rgb(204,70,120)'}
        ];
        var visibleCats = {catalunya: true, espanya: true, estranger: true};
        var currentYear = '2022';

        function categoryOf(feature) {
            return String(feature.properties['layer']).split('_').pop();
        }
        function applyCategories() {
            var layer = yearLayers[currentYear];
            var styleFn = styleFns[currentYear];
            layer.eachLayer(function (marker) {
                if (visibleCats[categoryOf(marker.feature)]) {
                    marker.setStyle(styleFn(marker.feature));
                } else {
                    marker.setStyle({opacity: 0, fillOpacity: 0});
                }
            });
        }
        function showYear(year) {
            if (year === currentYear) return;
            map.removeLayer(yearLayers[currentYear]);
            currentYear = year;
            map.addLayer(yearLayers[currentYear]);
            applyCategories();
        }

        var DotControl = L.Control.extend({
            options: {position: 'topright'},
            onAdd: function () {
                var div = L.DomUtil.create('div', 'dd-control');
                var html = '<div class="dd-title">Any</div>' +
                    '<label><input type="radio" name="dd-year" value="2022" checked> 2022</label>' +

                    '<div class="dd-title">Lloc de naixement</div>';
                categories.forEach(function (c) {
                    html += '<label><input type="checkbox" class="dd-cat" value="' + c.key + '" checked>' +

                html += '<div class="dd-note">1 punt = 500 habitants</div>';
                div.innerHTML = html;
                L.DomEvent.disableClickPropagation(div);
                L.DomEvent.disableScrollPropagation(div);
                div.querySelectorAll('input[name="dd-year"]').forEach(function (input) {
                    input.addEventListener('change', function () { showYear(this.value); });
                });
                div.querySelectorAll('.dd-cat').forEach(function (input) {
                    input.addEventListener('change', function () {
                        visibleCats[this.value] = this.checked;
                        applyCategories();
                    });
                });
                return div;
            }
        });
        new DotControl().addTo(map);
        setBounds();
        </script>

</html>
